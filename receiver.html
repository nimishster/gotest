<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR File Receiver</title>
  <!-- html5-qrcode library for mobile camera scanning -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      margin-bottom: 15px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }
    .btn.download {
      background: var(--primary);
      display: none;
      text-decoration: none;
      box-sizing: border-box;
    }
    .progress-box {
      margin: 15px 0;
      text-align: left;
    }
    .progress-bar-bg {
      width: 100%;
      height: 16px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.15s ease;
    }
    .file-meta {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .chunk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
      gap: 4px;
      margin-top: 12px;
      max-height: 160px;
      overflow-y: auto;
      padding: 6px;
      background: #f1f5f9;
      border-radius: 8px;
    }
    .chunk-cell {
      font-size: 0.65rem;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #cbd5e1;
      color: #475569;
      border-radius: 4px;
      font-weight: 600;
    }
    .chunk-cell.received {
      background: var(--primary);
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📷 QR File Receiver</h1>

  <div id="reader"></div>

  <button id="startBtn" class="btn">Start Camera Scanner</button>
  <a id="downloadBtn" class="btn download">⬇ Download Received File</a>

  <div class="progress-box">
    <div class="file-meta" id="fileMeta">Waiting to scan QR code...</div>
    <div style="display:flex; justify-content:space-between; font-size:0.85rem; font-weight:600;">
      <span id="chunkStats">0 / 0 Chunks</span>
      <span id="percentStats">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="chunk-grid" id="chunkGrid"></div>
  </div>
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const fileMeta = document.getElementById('fileMeta');
  const chunkStats = document.getElementById('chunkStats');
  const percentStats = document.getElementById('percentStats');
  const progressBar = document.getElementById('progressBar');
  const chunkGrid = document.getElementById('chunkGrid');

  let html5QrCode = null;
  let isScanning = false;

  // Transfer State
  let currentTransferId = null;
  let totalChunks = 0;
  let receivedChunks = new Map();
  let fileInfo = {
    name: 'downloaded_file',
    size: 0,
    mime: 'application/octet-stream'
  };
  let isComplete = false;

  function resetTransfer(transferId, total) {
    currentTransferId = transferId;
    totalChunks = total;
    receivedChunks.clear();
    isComplete = false;
    downloadBtn.style.display = 'none';

    // Build visual grid of chunks
    chunkGrid.innerHTML = '';
    for (let i = 0; i < totalChunks; i++) {
      const cell = document.createElement('div');
      cell.className = 'chunk-cell';
      cell.id = `chunk-cell-${i}`;
      cell.textContent = i + 1;
      chunkGrid.appendChild(cell);
    }
    updateUI();
  }

  function updateUI() {
    const count = receivedChunks.size;
    const pct = totalChunks > 0 ? Math.round((count / totalChunks) * 100) : 0;
    chunkStats.textContent = `${count} / ${totalChunks} Chunks`;
    percentStats.textContent = `${pct}%`;
    progressBar.style.width = `${pct}%`;
  }

  function onScanSuccess(decodedText) {
    if (isComplete) return;

    const parts = decodedText.split('|');
    const type = parts[0];

    // Header Frame: H|<transferId>|<totalChunks>|<fileName>|<fileSize>|<mimeType>
    if (type === 'H' && parts.length >= 6) {
      const [_, transferId, totalStr, nameEnc, sizeStr, mimeEnc] = parts;
      const total = parseInt(totalStr, 10);

      if (currentTransferId !== transferId) {
        resetTransfer(transferId, total);
      }

      fileInfo.name = decodeURIComponent(nameEnc);
      fileInfo.size = parseInt(sizeStr, 10);
      fileInfo.mime = decodeURIComponent(mimeEnc);

      const kb = (fileInfo.size / 1024).toFixed(1);
      fileMeta.textContent = `Receiving: ${fileInfo.name} (${kb} KB)`;
    }

    // Data Frame: D|<transferId>|<chunkIndex>|<totalChunks>|<base64Data>
    else if (type === 'D' && parts.length >= 5) {
      const transferId = parts[1];
      const idx = parseInt(parts[2], 10);
      const total = parseInt(parts[3], 10);
      const chunkData = parts.slice(4).join('|');

      if (currentTransferId !== transferId) {
        resetTransfer(transferId, total);
        fileMeta.textContent = `Receiving file (scanning for header...)`;
      }

      if (!receivedChunks.has(idx)) {
        receivedChunks.set(idx, chunkData);
        const cell = document.getElementById(`chunk-cell-${idx}`);
        if (cell) cell.classList.add('received');
        updateUI();

        // Check if all chunks have been collected
        if (receivedChunks.size === totalChunks && totalChunks > 0) {
          assembleFile();
        }
      }
    }
  }

  function base64ToUint8Array(base64) {
    const binaryString = atob(base64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes;
  }

  function assembleFile() {
    isComplete = true;
    stopScanner();

    try {
      let fullBase64 = '';
      for (let i = 0; i < totalChunks; i++) {
        fullBase64 += receivedChunks.get(i);
      }

      const byteArray = base64ToUint8Array(fullBase64);
      const blob = new Blob([byteArray], { type: fileInfo.mime });
      const url = URL.createObjectURL(blob);

      downloadBtn.href = url;
      downloadBtn.download = fileInfo.name;
      downloadBtn.textContent = `⬇ Download ${fileInfo.name}`;
      downloadBtn.style.display = 'block';
      fileMeta.textContent = `✅ Transfer Complete: ${fileInfo.name}`;
    } catch (err) {
      fileMeta.textContent = '❌ Error assembling file: ' + err.message;
    }
  }

  async function startScanner() {
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    try {
      isComplete = false;
      await html5QrCode.start(
        { facingMode: "environment" }, // Rear camera
        {
          fps: 25, // Scan up to 25 times per second
          qrbox: { width: 250, height: 250 }
        },
        onScanSuccess,
        () => {} // Ignore frame scan errors
      );
      isScanning = true;
      startBtn.textContent = 'Stop Camera';
      startBtn.style.background = '#dc2626';
    } catch (err) {
      alert("Camera access failed. Note: Mobile browsers require HTTPS or localhost to access the camera.\n\nError: " + err);
    }
  }

  async function stopScanner() {
    if (html5QrCode && isScanning) {
      await html5QrCode.stop();
      isScanning = false;
      startBtn.textContent = 'Start Camera Scanner';
      startBtn.style.background = '#2563eb';
    }
  }

  startBtn.addEventListener('click', () => {
    if (isScanning) stopScanner();
    else startScanner();
  });
</script>

</body>
</html>
